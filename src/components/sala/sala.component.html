<body>
<main>
  <div
    *ngFor="let tavolo of tavoli"
    cdkDrag
    class="app-tavolo"
    [cdkDragFreeDragPosition]="{ x: tavolo.x, y: tavolo.y }"
    (cdkDragEnded)="onDragEnded($event, tavolo)">


    <div class="app-tavolo-header">
      <button class="btn btn-primary"></button>
      <button class="btn btn-danger" (click)="tavolo.occupato = !tavolo.occupato">
        {{ tavolo.occupato ? 'Libero' : 'Occupato' }}
      </button>
    </div>

    <h1>{{tavolo.id}} </h1>


    </div>
</main>
</body>
