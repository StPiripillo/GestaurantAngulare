<body>
<main>
    <div *ngFor="let tavolo of tavoli" cdkDrag  class="app-tavolo"
      [cdkDragFreeDragPosition]="{ x: tavolo.x, y: tavolo.y }"
      (cdkDragMoved)="onDragMoved($event, tavolo)"
    >



      <div class="app-tavolo-header">
        <button class="btn btn-primary" >Salva</button>
        <button class="btn btn-danger" (click)="tavolo.occupato">Occupato</button>
      </div>
      <div class="app-tavolo-body">
        <h3>Numero</h3>
        <input type="text" [(ngModel)]="tavolo.numeroTAvolo" />
      </div>



      {{ tavolo.numeroTAvolo }}
    </div>
</main>
</body>
