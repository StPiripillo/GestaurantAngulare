<meta name="viewport" content="width=device-width, initial-scale=1.0">
<body>
  <main>
    <div
      *ngFor="let tavolo of tavoloS.TavoliInApp"
      cdkDrag
      [cdkDragDisabled]="!tavoloS.dragAttivo"
      class="app-tavolo"
      [cdkDragFreeDragPosition]="{ x: tavolo.x, y: tavolo.y }"
      (cdkDragStarted)="onDragStart()"
      (cdkDragEnded)="onDragEnd(); onDragEnded($event, tavolo)">

      <div [style.background-color] = "coloriTavolo[tavolo.occupato]"
           [ngStyle]="{boxShadow: tavoloHoverId === (tavolo.id ?? null) ? '0 0 12px 3px ' + coloriTavolo[tavolo.occupato] + ', 0 4px 10px rgba(0,0,0,0.2)' : ''}"
           (mouseenter)="tavoloHoverId = tavolo.id ?? null"
           (mouseleave)="tavoloHoverId = null"
           [ngClass]="{'Rotondo': tavolo.forma == Forma.ROTONDO, 'Quadrato': tavolo.forma == Forma.QUADRATO, 'Rettangolare': tavolo.forma == Forma.RETTANGOLARE,
           'Piccolo': tavolo.dimensione == Dimensione.PICCOLO, 'Medio': tavolo.dimensione == Dimensione.MEDIO, 'Grande': tavolo.dimensione == Dimensione.GRANDE}"
           class="app-tavolo-container">
        <div class="app-tavolo-items">
          <h4 class="app-tavolo-stato">
            {{ tavolo.occupato === 0 ? 'Libero' : tavolo.occupato === 1 ? 'Prenotato' : 'Occupato' }}
          </h4>
          <h1 class="app-tavolo-numero">{{tavolo.numeroTavolo}} </h1>
        </div>
        <div class="menu-dropdown" *ngIf="!isDragging">
          <ul>
            <li>
              <h1 class="app-tavolo-posti">Posti : {{tavolo.posti}}</h1>
            </li>
            <li>
              <button class="button-stato" (click)="cambiaStato(tavolo)">
                Cambia stato
              </button>
            </li>
            <li>
              <button class="button-ordine-open" (click)="openModal(); tavoloS.idTavoloSelezionato=tavolo.id!">Ordina</button>
            </li>
            <li>
              <button class="button-ordine" (click)="mostraDialog=true">Modifica</button>
              <div class="modal" *ngIf="mostraDialog">
                <div class="modal-content">
                  <span class="close" (click)="chiudiProdDialog()"></span>
                  <form class="modifica-numero-container" (ngSubmit)="cambioNumero(tavolo)">
                    <div class="form-group">
                      <label for="numero">Nuovo Numero Tavolo:</label>
                      <input id="numero" type="text" [(ngModel)]="nuovoNumero" name="numero" required />
                    </div>
                    <div class="modal-actions">
                      <button type="button" (click)="chiudiProdDialog()">Annulla</button>
                      <button type="submit">Modifica</button>
                    </div>
                  </form>
                </div>
              </div>
            </li>
            <li>
              <button class="button-cancella" (click)="cancellaTavolo(tavolo)">Elimina</button>
              <div *ngIf="mostraConfermaEliminazione" class="overlay">
                <div class="conferma-box">
                  <p>Sei sicuro di voler eliminare il tavolo {{ tavoloDaEliminare?.numeroTavolo }}?</p>
                  <div class="modal-actions">
                    <button (click)="confermaEliminazione()">Conferma</button>
                    <button (click)="annullaEliminazione()">Annulla</button>
                  </div>
                </div>
              </div>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </main>
</body>
