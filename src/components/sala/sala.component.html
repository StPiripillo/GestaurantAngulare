<body>
<main>
  <div
    *ngFor="let tavolo of tavoli"
    cdkDrag
    class="app-tavolo"
    [cdkDragFreeDragPosition]="{ x: tavolo.x, y: tavolo.y }"
    (cdkDragEnded)="onDragEnded($event, tavolo)">



    <div class="app-tavolo-header">
      {{ tavolo.occupato ? 'Libero' : 'Occupato' }}
      <div class="menu-dropdown">
        <ul>
          <li>
            <button class="btn btn-danger" (click)="occupaTavolo(tavolo)">Occupa/Libera</button>
          </li>
          <li>
            <button class="btn btn-success" (click)="openModal()">Ordina</button>
          </li>
          <li>
            <button class="btn btn-warning" (click)="cambioNumero(tavolo)">Modifica</button>
          </li>
        </ul>
      </div>
      <h1>{{tavolo.numeroTavolo}} </h1>
      <button class="btn btn-primary" (click)="cancellaTavolo(tavolo)">Elimina</button>

    </div>
    </div>
</main>
</body>
