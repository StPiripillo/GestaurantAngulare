<nav class="navbar">
  <ul>
    <li *ngFor="let tipo of tipologie">
      <button (click)="selezionaTipologia(tipo)"
        [class.active]="tipo===tipologiaSelezionata">
        {{ tipo }}
      </button>
    </li>
  </ul>
  <button (click)="openCart()">Carrello</button>
</nav>

<div class="piatti-container" *ngIf="tipologiaSelezionata">
  <h2>{{ tipologiaSelezionata }}</h2>
  <ul>
    <li *ngFor="let prodotto of piattifiltrati">{{prodotto.nome}} {{prodotto.prezzo | currency:'EUR':'symbol'}}
      <button (click)="modificaPrezzo(prodotto.id)">Cambia Prezzo</button>
      <button (click)="eliminaProdotto(prodotto.id)">Elimina Prodotto</button>
      <button (click)="aggiungiAlCarrello(prodotto)" (click)="openCart()">Aggiungi al Carrello</button>
    </li>


  </ul>

</div>
<div *ngIf="piattifiltrati.length===0">
    <p>Nessun prodotto disponibile per la tipologia selezionata</p>
</div>

<button (click)="toggleNota()">Nota</button>

<div *ngIf="spaziatoreAttivo" style="
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background-color: white;
    padding: 1rem;
    border: 1px solid #ccc;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.2);
    z-index: 1000;
    width: 300px;
">
  <textarea #annotazioneTextarea placeholder="Scrivi un'annotazione" rows="4" style="width: 100%;"></textarea>
  <br />
  <button (click)="salvaAnnotazione()">Salva Annotazione</button>
</div>


<div class="cart-backdrop" *ngIf="isOpen" (click)="closeCart()"></div>

<div class="cart-sidebar" [class.open]="isOpen">
  <div class="cart-header">
    <h3>Il Tuo Ordine</h3>
    <button class="close-btn" (click)="closeCart()">×</button>
  </div>
  <div class="cart-content">

    <li *ngFor="let item of carrello">
      {{ item.nome }} - {{ item.prezzo | currency }}
    </li>
  </div>
  <div *ngIf="annotazione.length > 0" class="annotazioni-carrello"
       style="margin-top: 1rem; border-top: 1px solid #ccc; padding-top: 0.5rem;">
    <h4>Annotazioni</h4>
    <ul>
      <li *ngFor="let nota of annotazione; let i = index">
        {{ nota }}
        <button (click)="rimuoviAnnotazione(i)" style="margin-left: 1rem; color: red;">🗑</button>
      </li>
    </ul>
  </div>


  <button class="close-btn" (click)="creaOrdine()">Ordina</button>


</div>
<div *ngIf="isOpen" class="carrello">
  <button (click)="closeCart()">Chiudi</button>
</div>

<hr>






<app-prodotti  #cart #prodottiComponent></app-prodotti>
