<div *ngFor="let prodotto of prodotto" class="prodotto">
  <h3>{{ prodotto.nome }}</h3>
  <p>Descrizione: {{ prodotto.ingredienti }}</p>
  <p>Prezzo: {{ prodotto.prezzo | currency:'EUR':'symbol' }}</p>
  <button (click)="modificaPrezzo(prodotto, 0)">Cambia Prezzo</button>
  <button (click)="eliminaProdotto(prodotto.id)">Elimina Prodotto</button>
</div>
