<nav class="nav-menu-button navbar-dark bg-info-subtle shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold">Gestione tavoli</a>
    <button class="btn btn-primary me-2" (click)="salvaTavolo()">Nuovo Tavolo</button>
  </div>
</nav>

<div class="grid-container">
  <div *ngFor="let tavolo of tavoli" class="grid-item">
    <p>Tavolo {{ tavolo.numeroTAvolo }}</p>
    <p>Posti: {{ tavolo.posti }}</p>
    <p>Stato: {{ tavolo.occupato ? 'Occupato' : 'Libero' }}</p>
  </div>
</div>
